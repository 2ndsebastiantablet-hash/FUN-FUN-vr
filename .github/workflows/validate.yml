name: Validate static WebXR game

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate collectible placement
        run: node tests/collectibles.test.mjs
      - name: Validate moving platform mechanic
        run: node tests/moving-platform.test.mjs
      - name: Validate rotating obstacle mechanic
        run: node tests/rotating-obstacle.test.mjs
      - name: Validate rotating overdrive tuning
        run: node tests/rotating-overdrive.test.mjs
      - name: Validate falling platform mechanic
        run: node tests/falling-platform.test.mjs
      - name: Validate timed platform mechanic
        run: node tests/timed-platform.test.mjs
      - name: Validate button and lever mechanic
        run: node tests/interaction-switch.test.mjs
      - name: Validate Quest runtime error guard
        run: node tests/runtime-error-guard.test.mjs
      - name: Validate Quest vector readiness
        run: node tests/quest-vector-readiness.test.mjs
      - name: Check JavaScript syntax
        run: |
          node --check main.js
          node --check platformer-course.js
          node --check course-calibration.js
          node --check course-modules.js
          node --check course-selector.js
          node --check generated-components.js
          node --check generated-course.js
          node --check comfort-fixes.js
          node --check comfort-fixes-v2.js
          node --check comfort-fixes-v3.js
          node --check run-progression.js
          node --check collectibles.js
          node --check moving-platform.js
          node --check mechanics-lab.js
          node --check lab-collision-tuning.js
          node --check rotating-obstacle.js
          node --check rotating-lab.js
          node --check rotating-overdrive.js
          node --check falling-platform.js
          node --check falling-lab.js
          node --check timed-platform.js
          node --check timed-lab.js
          node --check interaction-switch.js
          node --check interaction-lab.js
          node --check runtime-error-guard.js
          node --check multiplayer.js
          node --check multiplayer-hardening.js
      - name: Validate 2,000 generated seeds
        run: node tests/course-generator.test.mjs
      - name: Validate generated browser bootstrap
        run: node tests/generated-bootstrap.test.mjs
      - name: Validate comfort and progression
        run: node tests/comfort-progression.test.mjs
      - name: Parse static HTML entries
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Parser(HTMLParser):
              pass
          for name in ("index.html", "generated.html", "asset-gallery.html", "mechanics-lab.html", "rotating-lab.html", "falling-lab.html", "timed-lab.html", "interaction-lab.html"):
              parser = Parser()
              parser.feed(Path(name).read_text(encoding="utf-8"))
              print(f"Parsed {name}")
          PY
