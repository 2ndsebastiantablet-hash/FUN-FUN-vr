name: Validate static WebXR game

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate collectible placement
        run: node tests/collectibles.test.mjs
      - name: Validate moving platform mechanic
        run: node tests/moving-platform.test.mjs
      - name: Validate rotating obstacle mechanic
        run: node tests/rotating-obstacle.test.mjs
      - name: Validate rotating overdrive tuning
        run: node tests/rotating-overdrive.test.mjs
      - name: Validate falling platform mechanic
        run: node tests/falling-platform.test.mjs
      - name: Validate timed platform mechanic
        run: node tests/timed-platform.test.mjs
      - name: Validate button and lever mechanic
        run: node tests/interaction-switch.test.mjs
      - name: Validate Quest lever input fallback
        run: node tests/lever-input-fix.test.mjs
      - name: Validate hazard batch mechanics
        run: node tests/hazard-pack.test.mjs
      - name: Validate retuned hazard behavior
        run: node tests/hazard-retune-v2.test.mjs
      - name: Validate real rigid bodies and collision twins
        run: node tests/push-structure.test.mjs
      - name: Validate solid hands and physics interactions
        run: node tests/solid-hands-interactions.test.mjs
      - name: Validate integrated procedural course
        run: node tests/integrated-procedural.test.mjs
      - name: Validate advanced integrated course
        run: node tests/advanced-integrated.test.mjs
      - name: Validate creative puzzle expedition
        run: node tests/creative-puzzle.test.mjs
      - name: Validate creative puzzle V2 rebuild
        run: node tests/creative-puzzle-v2.test.mjs
      - name: Validate Quest runtime error guard
        run: node tests/runtime-error-guard.test.mjs
      - name: Validate Quest vector readiness
        run: node tests/quest-vector-readiness.test.mjs
      - name: Check JavaScript syntax
        run: |
          node --check main.js
          node --check platformer-course.js
          node --check course-calibration.js
          node --check course-modules.js
          node --check course-selector.js
          node --check generated-components.js
          node --check generated-course.js
          node --check comfort-fixes.js
          node --check comfort-fixes-v2.js
          node --check comfort-fixes-v3.js
          node --check run-progression.js
          node --check collectibles.js
          node --check moving-platform.js
          node --check mechanics-lab.js
          node --check lab-collision-tuning.js
          node --check rotating-obstacle.js
          node --check rotating-lab.js
          node --check rotating-overdrive.js
          node --check falling-platform.js
          node --check falling-lab.js
          node --check timed-platform.js
          node --check timed-lab.js
          node --check interaction-switch.js
          node --check lever-input-fix.js
          node --check interaction-lab.js
          node --check hazard-pack.js
          node --check hazard-contact-adjust.js
          node --check hazard-retune-v2.js
          node --check hazard-lab.js
          node --check real-physics-objects.js
          node --check paired-model-collider.js
          node --check physics-lane-boundaries.js
          node --check pipe-placement-v2.js
          node --check solid-physics-hands.js
          node --check physics-interactions.js
          node --check physics-interaction-boundaries.js
          node --check physics-interaction-tuning.js
          node --check physics-interaction-lab.js
          node --check integrated-procedural-modules.js
          node --check integrated-procedural-lab.js
          node --check advanced-integrated-modules.js
          node --check advanced-physics-surfaces.js
          node --check advanced-course-extension.js
          node --check creative-puzzle-plan.js
          node --check creative-puzzle-systems.js
          node --check creative-control-tuning.js
          node --check creative-route-tuning.js
          node --check creative-puzzle-input-v2.js
          node --check creative-puzzle-logic-v2.js
          node --check creative-puzzle-route-v2.js
          node --check creative-puzzle-visual-v2.js
          node --check creative-puzzle-lab.js
          node --check structure-slope-base.js
          node --check structure-lab.js
          node --check runtime-error-guard.js
          node --check multiplayer.js
          node --check multiplayer-hardening.js
      - name: Validate 2,000 generated seeds
        run: node tests/course-generator.test.mjs
      - name: Validate generated browser bootstrap
        run: node tests/generated-bootstrap.test.mjs
      - name: Validate comfort and progression
        run: node tests/comfort-progression.test.mjs
      - name: Parse static HTML entries
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Parser(HTMLParser):
              pass
          for name in ("index.html", "generated.html", "asset-gallery.html", "labs.html", "mechanics-lab.html", "rotating-lab.html", "falling-lab.html", "timed-lab.html", "interaction-lab.html", "hazard-lab.html", "structure-lab.html", "physics-interaction-lab.html", "integrated-lab.html", "advanced-integrated-lab.html", "creative-puzzle-lab.html"):
              parser = Parser()
              parser.feed(Path(name).read_text(encoding="utf-8"))
              print(f"Parsed {name}")
          PY
