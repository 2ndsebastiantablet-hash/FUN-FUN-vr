<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>FUN-FUN VR — KayKit Asset Gallery</title>
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <script type="module" src="./asset-gallery.js"></script>
  <style>
    html, body { width: 100%; height: 100%; }
    body { margin: 0; overflow: hidden; background: #0f172a; font-family: Arial, sans-serif; }
    #gallery-status {
      position: fixed;
      z-index: 20;
      top: max(12px, env(safe-area-inset-top));
      left: max(12px, env(safe-area-inset-left));
      max-width: min(520px, calc(100vw - 24px));
      padding: 10px 12px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 10px;
      color: #fff;
      background: rgba(15,23,42,.9);
      line-height: 1.4;
      pointer-events: none;
    }
    #gallery-status[data-state="ready"] { border-color: rgba(74,222,128,.75); }
    #gallery-status[data-state="error"] { border-color: rgba(248,113,113,.9); background: rgba(69,10,10,.94); }
    #back-link {
      position: fixed;
      z-index: 21;
      right: max(12px, env(safe-area-inset-right));
      top: max(12px, env(safe-area-inset-top));
      padding: 10px 12px;
      border-radius: 10px;
      color: #fff;
      background: rgba(15,23,42,.9);
      text-decoration: none;
      border: 1px solid rgba(255,255,255,.22);
    }
    body.vr-active #gallery-status,
    body.vr-active #back-link { display: none; }
  </style>
</head>
<body>
  <div id="gallery-status" data-state="checking">Preparing the Phase 1 KayKit asset gallery…</div>
  <a id="back-link" href="./">Back to game</a>

  <a-scene
    renderer="antialias: true; colorManagement: true"
    vr-mode-ui="enabled: true"
    webxr="referenceSpaceType: local-floor; optionalFeatures: local-floor, bounded-floor"
    loading-screen="dotsColor: #38BDF8; backgroundColor: #0F172A"
    background="color: #BAE6FD"
    fog="type: linear; color: #BAE6FD; near: 35; far: 95"
  >
    <a-entity light="type: ambient; intensity: 0.82"></a-entity>
    <a-entity light="type: directional; intensity: 0.9" position="6 12 7"></a-entity>
    <a-sky color="#BAE6FD"></a-sky>

    <a-entity id="gallery-rig" position="0 0 14">
      <a-camera position="0 1.6 0" wasd-controls="acceleration: 28" look-controls></a-camera>
    </a-entity>

    <a-plane rotation="-90 0 0" width="58" height="50" color="#CBD5E1"></a-plane>
    <a-entity id="gallery-grid"></a-entity>

    <a-plane position="0 6 -22" width="22" height="2.4" color="#FFFFFF">
      <a-text value="FUN-FUN VR — KAYKIT PHASE 1 CORE ASSETS" position="0 0.42 0.01" align="center" width="17" color="#0F172A"></a-text>
      <a-text value="12 converted GLB assets • original map intentionally unchanged" position="0 -0.42 0.01" align="center" width="14" color="#334155"></a-text>
    </a-plane>
  </a-scene>
</body>
</html>
