<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <title>FUN-FUN VR Gorilla Locomotion</title>

  <!-- A-Frame includes WebXR support and automatically provides the Enter VR button. -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

  <!-- Exact locomotion component pinned to the requested source commit. -->
  <script src="https://cdn.jsdelivr.net/gh/2ndsebastiantablet-hash/feeble@28a426aa6ade789320e2202cfa8d2fe61b46b539/templates/gorilla-tag-locomotion/gorilla-locomotion.js"></script>
  <script type="module" src="./main.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #111827;
    }

    #note {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10;
      max-width: 390px;
      padding: 10px 12px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      color: #ffffff;
      background: rgba(17, 24, 39, 0.82);
      font-size: 14px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div id="note">
    Open this page in Meta Quest Browser, press Enter VR, and push against the floor or blocks with your hands.
  </div>

  <a-scene
    renderer="antialias: true; colorManagement: true"
    vr-mode-ui="enabled: true"
    webxr="referenceSpaceType: local-floor; optionalFeatures: local-floor, bounded-floor, hand-tracking"
    background="color: #CFE8FF"
  >
    <a-entity light="type: ambient; intensity: 0.7"></a-entity>
    <a-entity light="type: directional; intensity: 0.9" position="3 6 2"></a-entity>
    <a-sky color="#CFE8FF"></a-sky>

    <!-- Scene wiring adapted directly from the pinned Gorilla Tag locomotion template. -->
    <a-entity
      id="player-rig"
      position="0 0 4"
      gorilla-locomotion="leftHand: #left-hand; rightHand: #right-hand; head: #player-camera; debugText: #debug-text; playerHeightOffset: 0.68"
    >
      <a-camera id="player-camera" position="0 0 0" wasd-controls-enabled="false">
        <a-entity id="debug-panel" position="0 -0.12 -1.2">
          <a-plane width="2.4" height="1.6" color="#111111" opacity="0.82"></a-plane>
          <a-text
            id="debug-text"
            position="-1.09 0.66 0.01"
            align="left"
            anchor="left"
            baseline="top"
            width="2.2"
            color="#FFFFFF"
            value="Waiting for hand tracking..."
          ></a-text>
        </a-entity>
      </a-camera>

      <a-entity id="left-hand" position="-0.35 -0.35 -0.4" tracked-controls="hand: left">
        <a-sphere id="left-hand-visual" radius="0.12" color="#FF7AA2" opacity="0.95"></a-sphere>
      </a-entity>

      <a-entity id="right-hand" position="0.35 -0.35 -0.4" tracked-controls="hand: right">
        <a-sphere id="right-hand-visual" radius="0.12" color="#6FC3FF" opacity="0.95"></a-sphere>
      </a-entity>
    </a-entity>

    <a-plane
      position="0 0 0"
      rotation="-90 0 0"
      width="24"
      height="24"
      color="#4FAD5B"
      locomotion-collider="type: floor; size: 24 0 24"
    ></a-plane>

    <a-box
      position="0 1 -3"
      width="1.8"
      height="2"
      depth="1.8"
      color="#7C3AED"
      locomotion-collider="type: box; size: 1.8 2 1.8"
    ></a-box>

    <a-box
      position="-2.2 1.5 -5"
      width="1.6"
      height="3"
      depth="1.6"
      color="#F28749"
      locomotion-collider="type: box; size: 1.6 3 1.6"
    ></a-box>

    <a-box
      position="2.4 0.8 -4.5"
      width="2.4"
      height="1.6"
      depth="1.6"
      color="#2563EB"
      locomotion-collider="type: box; size: 2.4 1.6 1.6"
    ></a-box>

    <a-box
      position="0 1.25 -7"
      width="6"
      height="2.5"
      depth="0.6"
      color="#E35D6A"
      locomotion-collider="type: box; size: 6 2.5 0.6"
    ></a-box>

    <a-plane position="0 3.2 -7.35" width="5.6" height="1.05" color="#FFFFFF">
      <a-text
        value="FUN-FUN VR - HAND LOCOMOTION"
        position="0 0.14 0.01"
        color="#111827"
        width="5"
        align="center"
      ></a-text>
      <a-text
        value="Push the floor or blocks to move and launch"
        position="0 -0.2 0.01"
        color="#334155"
        width="4.6"
        align="center"
      ></a-text>
    </a-plane>
  </a-scene>
</body>
</html>
